# ===========================================================================
# RS-485 SERIAL UART & MODBUS BUS
# Schneider PM2000 factory defaults: 19200 baud, 8 data bits, Even parity, 1 stop bit
# ===========================================================================
uart:
  id: modbus_uart
  rx_pin: GPIO17
  tx_pin: GPIO16
  baud_rate: 19200
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  turnaround_time: 35ms  # Centralized inter-frame silent interval

# ===========================================================================
# MODBUS CONTROLLER TIERS (Governs Polling Rates)
# ===========================================================================
modbus_controller:
  # Tier 1: Fast Operational Measurements (5s)
  - id: pm2230_fast
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 5s
    offline_skip_updates: 5

  # Tier 2: Energy Accumulators & Demand (20s)
  - id: pm2230_energy
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 20s
    offline_skip_updates: 5

  # Tier 3: Harmonics, Unbalance & Extremes (60s)
  - id: pm2230_quality
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 60s
    offline_skip_updates: 5

  # Tier 4: Hardware Config & Static Metadata (300s)
  - id: pm2230_static
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 300s
    offline_skip_updates: 5

# ===========================================================================
# TIME & NATIVE MODBUS_CLIENT RTC SYNCHRONIZATION
# ===========================================================================
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - script.execute: sync_pm2230_clock

script:
  - id: sync_pm2230_clock
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - modbus_client.write_multiple_registers:
                modbus_id: modbus_bus
                address: 1
                start_address: 1835
                values: !lambda |-
                  auto t = id(sntp_time).now();
                  uint16_t reg_ym = ((uint16_t(t.year - 2000) & 0xFF) << 8) | (uint16_t(t.month) & 0xFF);
                  uint16_t reg_dh = ((uint16_t(t.day_of_month) & 0xFF) << 8) | (uint16_t(t.hour) & 0xFF);
                  uint16_t reg_ms = ((uint16_t(t.minute) & 0xFF) << 8) | (uint16_t(t.second) & 0xFF);
                  ESP_LOGI("PM2230", "Dispatched RTC sync: 20%02u-%02u-%02u %02u:%02u:%02u",
                           (t.year - 2000), t.month, t.day_of_month, t.hour, t.minute, t.second);
                  return {reg_ym, reg_dh, reg_ms};

# ===========================================================================
# COMMAND CONTROLS & RESETS (Native modbus_client.write_multiple_registers)
# Writes [0000 (Password), Command Code] to Reg 5248 via FC16
# ===========================================================================
button:
  - platform: template
    name: "PM2230 Reset Peak Demand"
    id: pm2230_btn_reset_peak_demand
    icon: "mdi:chart-line-variant"
    entity_category: diagnostic
    on_press:
      - modbus_client.write_multiple_registers:
          modbus_id: modbus_bus
          address: 1
          start_address: 5248
          values: [0, 1001]

  - platform: template
    name: "PM2230 Reset Min-Max Extremes"
    id: pm2230_btn_reset_minmax
    icon: "mdi:history"
    entity_category: diagnostic
    on_press:
      - modbus_client.write_multiple_registers:
          modbus_id: modbus_bus
          address: 1
          start_address: 5248
          values: [0, 1002]

  - platform: template
    name: "PM2230 Reset Cumulative Energy"
    id: pm2230_btn_reset_energy
    icon: "mdi:gauge-empty"
    entity_category: diagnostic
    on_press:
      - modbus_client.write_multiple_registers:
          modbus_id: modbus_bus
          address: 1
          start_address: 5248
          values: [0, 1003]

  - platform: template
    name: "PM2230 Sync Clock Now"
    id: pm2230_btn_sync_clock
    icon: "mdi:clock-sync"
    entity_category: diagnostic
    on_press:
      - script.execute: sync_pm2230_clock

# ===========================================================================
# BINARY SENSORS: DIAGNOSTICS & ALARMS
# ===========================================================================
binary_sensor:
  - platform: status
    name: "PM2230 Node API Status"
    id: pm2230_node_status
    entity_category: diagnostic

  - platform: template
    name: "PM2230 Phase Loss Anomaly"
    id: pm2230_phase_loss_anomaly
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      if (!id(pm2230_voltage_v1_n).has_state() || 
          !id(pm2230_voltage_v2_n).has_state() || 
          !id(pm2230_voltage_v3_n).has_state()) return false;

      float v1 = id(pm2230_voltage_v1_n).state;
      float v2 = id(pm2230_voltage_v2_n).state;
      float v3 = id(pm2230_voltage_v3_n).state;
      if (isnan(v1) || isnan(v2) || isnan(v3)) return false;

      bool v1_dead = (v1 < 50.0f);
      bool v2_dead = (v2 < 50.0f);
      bool v3_dead = (v3 < 50.0f);
      bool any_live = (v1 > 180.0f || v2 > 180.0f || v3 > 180.0f);

      return any_live && (v1_dead || v2_dead || v3_dead);

  # Active Alarm Register 1 (Register 6099 0-based): Bitmasked from pm2230_energy poll
  - platform: modbus_controller
    modbus_controller_id: pm2230_energy
    name: "Alarm Over Voltage"
    id: pm2230_alarm_ov
    address: 6099
    register_type: holding
    bitmask: 0x0001
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: pm2230_energy
    name: "Alarm Under Voltage"
    id: pm2230_alarm_uv
    address: 6099
    register_type: holding
    bitmask: 0x0002
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: pm2230_energy
    name: "Alarm Over Current"
    id: pm2230_alarm_oc
    address: 6099
    register_type: holding
    bitmask: 0x0004
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: pm2230_energy
    name: "Alarm Voltage Unbalance"
    id: pm2230_alarm_v_unbal
    address: 6099
    register_type: holding
    bitmask: 0x0008
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: pm2230_energy
    name: "Alarm Phase Reversal"
    id: pm2230_alarm_phase_rev
    address: 6099
    register_type: holding
    bitmask: 0x0010
    device_class: problem

