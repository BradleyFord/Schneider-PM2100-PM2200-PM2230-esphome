    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      if (!id(pm2230_active_power_total).has_state()) return NAN;
      float p = id(pm2230_active_power_total).state;
      if (isnan(p)) return NAN;
      return (p > 0.0f) ? p : 0.0f;

