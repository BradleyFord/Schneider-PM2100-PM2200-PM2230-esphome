# ===========================================================================
# TEXT SENSORS: DIAGNOSTICS & SYSTEM STRINGS
# ===========================================================================
text_sensor:
  - platform: template
    name: "PM2230 Modbus Link Health"
    id: pm2230_modbus_link_health
    icon: "mdi:check-network"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (id(pm2230_voltage_ln_avg).has_state() && !isnan(id(pm2230_voltage_ln_avg).state)) {
        return std::string("Online / Polling Active");
      } else {
        return std::string("Communication Fault / Offline");
      }

  - platform: modbus_controller
    modbus_controller_id: pm2230_static
    name: "Firmware Version"
    id: pm2230_firmware_version
    address: 1636
    response_size: 4
    register_type: holding
    entity_category: diagnostic
    lambda: |-
      if (data.size() < 4) return std::string("Unknown");
      uint32_t val = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) | (uint32_t(data[2]) << 8) | uint32_t(data[3]);
      uint8_t major = (val >> 16) & 0xFF;
      uint8_t minor = (val >> 8) & 0xFF;
      uint8_t rev = val & 0xFF;
      char buf[16];
      snprintf(buf, sizeof(buf), "%u.%u.%u", major, minor, rev);
      return std::string(buf);

  - platform: modbus_controller
    modbus_controller_id: pm2230_static
    name: "System Wiring Configuration"
    id: pm2230_wiring_system
    address: 1999
    response_size: 2
    register_type: holding
    entity_category: diagnostic
    lambda: |-
      if (data.size() < 2) return std::string("Unknown");
      uint16_t raw = (uint16_t(data[0]) << 8) | uint16_t(data[1]);
      uint16_t type = raw & 0x7FFF;  // Strips bit 15 (Direct Connection flag)
      std::string mode = (raw & 0x8000) ? " (Direct Connect)" : " (PT Connected)";
      switch (type) {
        case 0: return std::string("3PH4W Wye") + mode;
        case 1: return std::string("3PH3W Delta") + mode;
        case 2: return std::string("1PH2W L-N") + mode;
        case 3: return std::string("1PH3W") + mode;
        case 4: return std::string("3PH3W Open Delta") + mode;
        default: return std::string("Configuration Code: " + std::to_string(raw));
      }
